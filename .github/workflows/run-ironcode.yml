name: Run IronCode

on:
  workflow_dispatch:

jobs:
  run-ironcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          no-cache: 'true' # Corrected input to disable cache

      - name: Install dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable # Add Rust toolchain

      - name: Build Rust library
        run: cargo build --release
        working-directory: packages/ironcode/native/tool # Build native library

      - name: Run IronCode
        run: bun run dev